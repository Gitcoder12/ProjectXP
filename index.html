<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProjectXP — Dev Progress Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #0a0a0a;
  --bg2:      #111111;
  --bg3:      #1a1a1a;
  --surface:  #131313;
  --surface2: #1a1a1a;
  --border:   #2a2a2a;
  --border2:  #3a3a3a;
  --border3:  #525252;
  --text:     #ffffff;
  --text2:    #b8b8b8;
  --text3:    #808080;
  --text4:    #4d4d4d;
  --white:    #ffffff;
  --mono:     'IBM Plex Mono', ui-monospace, monospace;
  --sans:     'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --display:  'Anton', 'Inter', sans-serif;
  --radius:   8px;
  --transition: 0.15s ease;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);
  background:var(--bg); color:var(--text);
  min-height:100vh; overflow-x:hidden;
  font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--border3)}

/* ── HEADER ── */
header{
  display:flex; align-items:center; justify-content:space-between;
  padding:1.15rem 2rem;
  background:var(--bg);
  border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:100;
}
.logo{
  font-family:var(--display); font-size:1.5rem; font-weight:400;
  letter-spacing:0.03em; text-transform:uppercase;
  color:var(--text);
  display:flex; align-items:center; gap:0.65rem;
  line-height:1;
}
.logo-mark{
  width:20px;height:20px;
  border:2px solid var(--text);
  border-radius:4px;
  position:relative;
  display:inline-block;
}
.logo-mark::after{
  content:'';
  position:absolute;
  top:3px;left:3px;
  width:6px;height:6px;
  background:var(--text);
  border-radius:1px;
}
.header-right{display:flex;align-items:center;gap:0.6rem}
.btn{
  display:inline-flex; align-items:center; gap:0.4rem;
  padding:0.55rem 1rem; border-radius:var(--radius);
  font-family:var(--sans); font-size:0.82rem; font-weight:500;
  cursor:pointer; border:1px solid var(--border2);
  transition:all var(--transition); text-decoration:none;
  background:transparent; color:var(--text2);
}
.btn:hover{border-color:var(--border3);color:var(--text);background:var(--surface2)}
.btn-primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn-primary:hover{background:var(--text2);border-color:var(--text2);color:var(--bg)}
.btn-sm{padding:0.4rem 0.75rem;font-size:0.75rem}

/* ── STATS BAR ── */
.stats-bar{
  display:grid; grid-template-columns:repeat(5,1fr);
  border-bottom:1px solid var(--border);
  background:var(--bg);
}
.stat-cell{
  padding:1.5rem 2rem;
  border-right:1px solid var(--border);
}
.stat-cell:last-child{border-right:none}
.stat-label{
  font-family:var(--sans); font-size:0.72rem; font-weight:500;
  letter-spacing:0.05em; text-transform:uppercase;
  color:var(--text3); margin-bottom:0.6rem;
}
.stat-value{
  font-family:var(--display); font-size:2.25rem; font-weight:400;
  color:var(--text); line-height:1; letter-spacing:0.02em;
}
.stat-value span{font-size:1rem;font-weight:400;color:var(--text2);margin-left:2px;font-family:var(--sans)}
.stat-sub{
  font-size:0.78rem; color:var(--text3); margin-top:0.4rem;
}

/* ── MAIN ── */
.main{max-width:1400px;margin:0 auto;padding:2rem}

/* ── TOOLBAR ── */
.toolbar{
  display:flex; align-items:center; gap:0.6rem;
  margin-bottom:2rem; flex-wrap:wrap;
}
.search-wrap{
  display:flex; align-items:center; gap:0.5rem;
  background:var(--surface); border:1px solid var(--border2);
  border-radius:var(--radius); padding:0.55rem 0.9rem;
  flex:1; min-width:220px; max-width:340px;
  transition:border-color var(--transition);
}
.search-wrap:focus-within{border-color:var(--border3)}
.search-wrap svg{color:var(--text3);flex-shrink:0}
.search-wrap input{
  background:none; border:none; outline:none;
  color:var(--text); font-family:var(--sans); font-size:0.85rem; width:100%;
}
.search-wrap input::placeholder{color:var(--text3)}
.filter-tabs{display:flex;gap:0}
.ftab{
  padding:0.55rem 0.9rem;
  font-family:var(--sans); font-size:0.78rem; font-weight:500;
  cursor:pointer;
  background:var(--surface); border:1px solid var(--border2);
  color:var(--text3); transition:all var(--transition);
  margin-left:-1px;
}
.ftab:first-child{border-radius:var(--radius) 0 0 var(--radius)}
.ftab:last-child{border-radius:0 var(--radius) var(--radius) 0}
.ftab:hover{color:var(--text);background:var(--surface2)}
.ftab.on{background:var(--text);color:var(--bg);border-color:var(--text);z-index:1}
.sort-select{
  background:var(--surface); border:1px solid var(--border2);
  color:var(--text2); font-family:var(--sans); font-size:0.8rem;
  padding:0.55rem 0.8rem; border-radius:var(--radius); outline:none; cursor:pointer;
  transition:border-color var(--transition);
}
.sort-select:hover{border-color:var(--border3)}
.sort-select:focus{border-color:var(--border3)}

/* ── PROJECT GRID ── */
#projects-container.grid-view{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(360px,1fr));
  gap:1rem;
}

/* ── PROJECT CARD ── */
.project-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius); padding:1.5rem;
  transition:all var(--transition); position:relative;
  overflow:hidden; cursor:pointer;
}
.project-card:hover{
  border-color:var(--border3);
  background:var(--surface2);
}
.project-card::before{
  content:''; position:absolute; top:0; left:0; right:0; height:2px;
  background:var(--text);
  transform:scaleX(var(--progress-fill,0));
  transform-origin:left; transition:transform 1s ease;
}

.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0.75rem;gap:1rem}
.card-title{
  font-family:var(--display); font-size:1.35rem; font-weight:400;
  letter-spacing:0.03em; text-transform:uppercase;
  color:var(--text); line-height:1.1;
}
.card-desc{
  font-size:0.88rem; color:var(--text2); line-height:1.65;
  margin-bottom:1.1rem;
}
.card-actions{display:flex;gap:0.4rem;opacity:0;transition:opacity var(--transition);flex-shrink:0}
.project-card:hover .card-actions{opacity:1}

/* Status badge — monochrome, differentiated by border style */
.status-badge{
  display:inline-flex; align-items:center; gap:0.4rem;
  padding:4px 10px; border-radius:4px;
  font-family:var(--mono); font-size:0.66rem; font-weight:500;
  letter-spacing:0.04em; text-transform:uppercase; flex-shrink:0;
  border:1px solid var(--border2);
  color:var(--text2);
}
.status-badge::before{
  content:''; width:5px;height:5px;border-radius:50%;
  background:currentColor;
}
.s-active{color:var(--text);border-color:var(--border3)}
.s-building{color:var(--text2);border-color:var(--border2);border-style:dashed}
.s-paused{color:var(--text3);border-color:var(--border)}
.s-complete{color:var(--text);background:var(--bg3);border-color:var(--border3)}
.s-broken{color:var(--text3);border-color:var(--border);text-decoration:line-through;text-decoration-color:var(--text4)}
.s-broken::before{background:var(--text3)}

/* Progress */
.progress-section{margin-bottom:1rem}
.progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.55rem}
.progress-label{
  font-family:var(--sans);font-size:0.7rem;color:var(--text3);
  letter-spacing:0.08em;text-transform:uppercase;font-weight:500;
}
.progress-pct{
  font-family:var(--mono);font-size:0.82rem;font-weight:500;
  color:var(--text);
}
.progress-track{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.progress-bar{
  height:100%; border-radius:2px;
  background:var(--text);
  transition:width 1s cubic-bezier(0.4,0,0.2,1);
}

/* Features */
.features-wrap{display:flex;flex-wrap:wrap;gap:0.4rem;margin-bottom:1rem}
.feature-tag{
  display:inline-flex; align-items:center; gap:0.35rem;
  padding:3px 9px; border-radius:4px;
  font-family:var(--sans); font-size:0.72rem; font-weight:500;
  border:1px solid var(--border);
  color:var(--text3);
}
.feature-tag.done{color:var(--text2);border-color:var(--border2)}
.feature-tag.done::before{content:'✓';font-size:0.65rem;color:var(--text2)}
.feature-tag.wip{color:var(--text2);border-color:var(--border2);border-style:dashed}
.feature-tag.wip::before{content:'~';font-size:0.8rem;color:var(--text2)}
.feature-tag.todo{color:var(--text3)}
.feature-tag.todo::before{content:'○';font-size:0.6rem;color:var(--text4)}

/* Card bottom */
.card-bottom{
  display:flex;justify-content:space-between;align-items:flex-end;
  margin-top:1rem;padding-top:1rem;
  border-top:1px solid var(--border);
  gap:1rem;
}
.card-tech{display:flex;gap:0.4rem;flex-wrap:wrap}
.tech-pill{
  padding:3px 8px; border-radius:3px;
  font-family:var(--mono); font-size:0.66rem;
  background:var(--bg3); color:var(--text2);
  border:1px solid var(--border);
}
.card-meta{text-align:right;flex-shrink:0}
.card-date{
  font-family:var(--mono);font-size:0.68rem;color:var(--text3);
}
.card-feat-count{
  font-family:var(--mono);font-size:0.68rem;color:var(--text2);
  margin-top:0.2rem;
}

/* ── MODAL ── */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,0.85);
  z-index:900; display:none; align-items:center; justify-content:center;
  padding:1rem;
}
.modal-backdrop.open{display:flex}
.modal{
  background:var(--bg2); border:1px solid var(--border2);
  border-radius:12px; width:min(680px,100%);
  max-height:90vh; overflow-y:auto;
  box-shadow:0 24px 48px rgba(0,0,0,0.6);
  animation:modal-in 0.15s ease-out;
}
@keyframes modal-in{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
.modal-header{
  display:flex; justify-content:space-between; align-items:center;
  padding:1.5rem 1.5rem 1rem;
  border-bottom:1px solid var(--border);
}
.modal-title{
  font-family:var(--display);font-size:1.5rem;font-weight:400;
  letter-spacing:0.03em;text-transform:uppercase;line-height:1;
}
.modal-close{
  width:32px;height:32px;border-radius:6px;
  background:transparent;border:1px solid var(--border2);
  color:var(--text2);cursor:pointer;font-size:0.9rem;
  display:flex;align-items:center;justify-content:center;
  transition:all var(--transition);
}
.modal-close:hover{border-color:var(--border3);color:var(--text)}
.modal-body{padding:1.5rem}

/* Form */
.form-group{margin-bottom:1.25rem}
.form-label{
  font-family:var(--sans);font-size:0.78rem;font-weight:500;
  color:var(--text2);display:block;margin-bottom:0.5rem;
}
.form-input,.form-textarea,.form-select{
  width:100%; background:var(--bg3); border:1px solid var(--border2);
  color:var(--text); font-family:var(--sans); font-size:0.88rem;
  padding:0.65rem 0.9rem; border-radius:var(--radius); outline:none;
  transition:border-color var(--transition);
}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--border3)}
.form-textarea{resize:vertical;min-height:80px;line-height:1.6;font-family:var(--sans)}
.form-select{cursor:pointer}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.form-hint{font-size:0.72rem;color:var(--text3);margin-top:0.5rem}

/* Feature editor */
.features-editor{display:flex;flex-direction:column;gap:0.5rem;margin-top:0.5rem}
.feature-row{display:flex;gap:0.4rem;align-items:center}
.feature-row input{
  flex:1;background:var(--bg3);border:1px solid var(--border2);
  color:var(--text);font-family:var(--sans);font-size:0.85rem;
  padding:0.45rem 0.75rem;border-radius:6px;outline:none;
}
.feature-row input:focus{border-color:var(--border3)}
.feature-row select{
  background:var(--bg3);border:1px solid var(--border2);color:var(--text2);
  font-family:var(--sans);font-size:0.78rem;
  padding:0.45rem 0.55rem;border-radius:6px;outline:none;cursor:pointer;
}
.feature-row .rm-btn{
  width:30px;height:30px;border-radius:6px;
  background:transparent;border:1px solid var(--border2);
  color:var(--text3);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:0.8rem;transition:all var(--transition);flex-shrink:0;
}
.feature-row .rm-btn:hover{border-color:var(--border3);color:var(--text)}
.add-feat-btn{
  font-family:var(--sans);font-size:0.82rem;font-weight:500;
  color:var(--text2);background:transparent;
  border:1px dashed var(--border2);border-radius:6px;
  padding:0.5rem 0.8rem;cursor:pointer;
  transition:all var(--transition);width:100%;margin-top:0.5rem;
}
.add-feat-btn:hover{border-color:var(--border3);color:var(--text)}

/* Tech tags */
.tech-input-wrap{display:flex;gap:0.4rem}
.tech-input-wrap input{flex:1}
#tech-tags{display:flex;flex-wrap:wrap;gap:0.4rem;margin-top:0.5rem}
.tech-tag-edit{
  display:inline-flex;align-items:center;gap:0.35rem;
  padding:3px 9px;border-radius:4px;
  font-family:var(--mono);font-size:0.72rem;
  background:var(--bg3);border:1px solid var(--border2);color:var(--text2);
}
.tech-tag-edit button{
  background:none;border:none;color:var(--text3);cursor:pointer;
  font-size:0.8rem;padding:0;line-height:1;
}
.tech-tag-edit button:hover{color:var(--text)}

/* ── EMPTY STATE ── */
.empty-state{
  text-align:center; padding:6rem 2rem;
  color:var(--text3);
}
.empty-state .big{font-size:2rem;margin-bottom:1rem;display:block;color:var(--text4)}
.empty-state p{font-size:0.9rem;margin-bottom:1.5rem}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:1.5rem;right:1.5rem;
  background:var(--surface2);border:1px solid var(--border2);
  color:var(--text);font-family:var(--sans);font-size:0.85rem;
  padding:0.75rem 1.1rem;border-radius:var(--radius);
  box-shadow:0 12px 32px rgba(0,0,0,0.6);
  transform:translateY(60px);opacity:0;
  transition:all 0.2s ease;
  z-index:9998;pointer-events:none;
}
.toast.show{transform:translateY(0);opacity:1}

/* ── DETAIL MODAL ── */
.detail-modal .modal{width:min(760px,100%)}
.detail-section{margin-bottom:1.75rem}
.detail-section-title{
  font-family:var(--sans);font-size:0.75rem;font-weight:500;
  letter-spacing:0.1em;text-transform:uppercase;
  color:var(--text3);margin-bottom:0.85rem;
  padding-bottom:0.5rem;border-bottom:1px solid var(--border);
}
.detail-features-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:0.5rem;
}
.detail-feat{
  padding:0.65rem 0.85rem;border-radius:6px;
  display:flex;align-items:center;gap:0.6rem;
  background:var(--bg3);border:1px solid var(--border);
  font-size:0.85rem;
}
.feat-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.feat-dot.done{background:var(--text2)}
.feat-dot.wip{background:var(--text3);border:1px solid var(--text3)}
.feat-dot.todo{background:transparent;border:1px solid var(--text4)}

@media(max-width:768px){
  .stats-bar{grid-template-columns:repeat(2,1fr)}
  .stat-cell:nth-child(5){border-top:1px solid var(--border)}
  header{padding:0.9rem 1.25rem}
  .main{padding:1.25rem}
  #projects-container.grid-view{grid-template-columns:1fr}
  .form-row{grid-template-columns:1fr}
  .logo{font-size:1.25rem}
  .card-title{font-size:1.2rem}
  .stat-value{font-size:1.75rem}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-mark"></span>
    ProjectXP
  </div>
  <div class="header-right">
    <span style="font-family:var(--mono);font-size:0.72rem;color:var(--text3);letter-spacing:0.03em" id="project-count-label">0 projects</span>
    <button class="btn btn-sm" onclick="importData()">Import</button>
    <button class="btn btn-sm" onclick="exportData()">Export</button>
    <button class="btn btn-sm btn-primary" onclick="openAddModal()">+ New Project</button>
  </div>
</header>

<div class="stats-bar">
  <div class="stat-cell">
    <div class="stat-label">Total Projects</div>
    <div class="stat-value" id="s-total">0</div>
    <div class="stat-sub">across all types</div>
  </div>
  <div class="stat-cell">
    <div class="stat-label">Avg Completion</div>
    <div class="stat-value" id="s-avg">0<span>%</span></div>
    <div class="stat-sub">overall progress</div>
  </div>
  <div class="stat-cell">
    <div class="stat-label">Complete</div>
    <div class="stat-value" id="s-complete">0</div>
    <div class="stat-sub">shipped</div>
  </div>
  <div class="stat-cell">
    <div class="stat-label">In Progress</div>
    <div class="stat-value" id="s-active">0</div>
    <div class="stat-sub">building now</div>
  </div>
  <div class="stat-cell">
    <div class="stat-label">Features Done</div>
    <div class="stat-value" id="s-feats">0</div>
    <div class="stat-sub" id="s-feats-sub">implemented</div>
  </div>
</div>

<main class="main">
  <div class="toolbar">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="search-input" placeholder="Search projects...">
    </div>
    <div class="filter-tabs">
      <button class="ftab on" data-filter="all">All</button>
      <button class="ftab" data-filter="active">Active</button>
      <button class="ftab" data-filter="building">Building</button>
      <button class="ftab" data-filter="complete">Done</button>
      <button class="ftab" data-filter="paused">Paused</button>
      <button class="ftab" data-filter="broken">Broken</button>
    </div>
    <select class="sort-select" id="sort-select">
      <option value="updated">Recent</option>
      <option value="progress-d">Progress ↓</option>
      <option value="progress-a">Progress ↑</option>
      <option value="name">Name A–Z</option>
      <option value="features">Most Features</option>
    </select>
  </div>

  <div id="projects-container" class="grid-view"></div>
</main>

<div class="modal-backdrop" id="add-modal" onclick="if(event.target===this)closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title" id="modal-title-text">New Project</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Project Name *</label>
          <input class="form-input" id="f-name" placeholder="e.g. LoreZone">
        </div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <select class="form-select" id="f-status">
            <option value="building">Building</option>
            <option value="active">Active</option>
            <option value="complete">Complete</option>
            <option value="paused">Paused</option>
            <option value="broken">Broken</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea class="form-textarea" id="f-desc" placeholder="What does this project do?"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Progress %</label>
          <input class="form-input" id="f-progress" type="number" min="0" max="100" placeholder="0–100">
        </div>
        <div class="form-group">
          <label class="form-label">GitHub URL</label>
          <input class="form-input" id="f-github" placeholder="github.com/user/repo">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Live URL</label>
        <input class="form-input" id="f-live" placeholder="username.github.io/project">
      </div>
      <div class="form-group">
        <label class="form-label">Features</label>
        <div class="features-editor" id="features-editor"></div>
        <button class="add-feat-btn" onclick="addFeatureRow()">+ Add Feature</button>
        <div class="form-hint">Mark each feature as: done / wip / todo</div>
      </div>
      <div class="form-group">
        <label class="form-label">Tech Stack</label>
        <div class="tech-input-wrap">
          <input class="form-input" id="tech-input" placeholder="e.g. React" onkeydown="if(event.key==='Enter'){event.preventDefault();addTech()}">
          <button class="btn" onclick="addTech()">Add</button>
        </div>
        <div id="tech-tags"></div>
      </div>
      <div style="display:flex;gap:0.6rem;justify-content:flex-end;margin-top:1.75rem">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveProject()" id="save-btn">Save Project</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop detail-modal" id="detail-modal" onclick="if(event.target===this)closeDetail()">
  <div class="modal" onclick="event.stopPropagation()">
    <div id="detail-content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── DATA ──
let projects = [];
let editingId = null;
let currentFilter = 'all';
let tempTech = [];

// ── HELPERS ──
function esc(s) {
  if (s === undefined || s === null) return '';
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}
function safeUrl(u) {
  if (!u) return '';
  const t = String(u).trim();
  if (!t) return '';
  return /^https?:\/\//i.test(t) ? t : 'https://' + t;
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}
function timeAgo(ts) {
  const d = Date.now() - (ts || Date.now());
  if(d < 60000) return 'just now';
  if(d < 3600000) return Math.floor(d/60000) + 'm ago';
  if(d < 86400000) return Math.floor(d/3600000) + 'h ago';
  return Math.floor(d/86400000) + 'd ago';
}

// ── STORAGE ──
function load() {
  try { projects = JSON.parse(localStorage.getItem('pxp_projects') || '[]'); }
  catch { projects = []; }
  if (!Array.isArray(projects)) projects = [];
  if (!projects.length) seedDemo();
}
function save() {
  localStorage.setItem('pxp_projects', JSON.stringify(projects));
}

function seedDemo() {
  projects = [
    {
      id: uid(), name: 'LoreZone', status: 'active',
      desc: 'Anime, manga, comics, movies, shows & books — every story in one place. Live search via Jikan API.',
      progress: 72,
      github: 'github.com/Gitcoder12/Lorezone',
      live: 'gitcoder12.github.io/Lorezone',
      tech: ['HTML','CSS','JS','Jikan API'],
      features: [
        {name:'B&W manga cards', status:'done'},
        {name:'Trailer hover autoplay', status:'done'},
        {name:'Genre Kings page', status:'done'},
        {name:'Dark content warnings', status:'done'},
        {name:'Live anime search (Jikan)', status:'done'},
        {name:'Staff & creator credits', status:'done'},
        {name:'Watchlist (localStorage)', status:'done'},
        {name:'Progress tracker', status:'done'},
        {name:'Indian & global comics', status:'done'},
        {name:'TMDB movie integration', status:'wip'},
        {name:'100+ titles database', status:'wip'},
        {name:'Franchise timeline view', status:'todo'},
        {name:'Mobile hamburger nav', status:'todo'},
        {name:'PWA support', status:'todo'},
      ],
      updated: Date.now()
    },
    {
      id: uid(), name: 'CivicShield', status: 'complete',
      desc: 'Food safety civic reporting platform for Hyderabad. 114 venues across 15 areas with FSSAI verification.',
      progress: 95,
      github: 'github.com/Gitcoder12/CivicShield',
      live: 'gitcoder12.github.io/CivicShield',
      tech: ['HTML','CSS','JS','JSON'],
      features: [
        {name:'114 venue database', status:'done'},
        {name:'Area heatmap', status:'done'},
        {name:'FSSAI verification', status:'done'},
        {name:'Citizen report flow', status:'done'},
        {name:'Inspector report flow', status:'done'},
        {name:'Backend API', status:'wip'},
      ],
      updated: Date.now() - 86400000
    },
    {
      id: uid(), name: 'WebSword', status: 'building',
      desc: 'Web security scanner & AI content detection platform. Flask + SQLite backend, single-file SPA frontend.',
      progress: 55,
      github: 'github.com/Gitcoder12/WebSword',
      live: '',
      tech: ['Python','Flask','SQLite','HTML','JS'],
      features: [
        {name:'Security scanner UI', status:'done'},
        {name:'AI detection panel', status:'done'},
        {name:'Flask API backend', status:'done'},
        {name:'SQLite integration', status:'wip'},
        {name:'Real scan engine', status:'todo'},
        {name:'User auth', status:'todo'},
      ],
      updated: Date.now() - 172800000
    },
    {
      id: uid(), name: 'MATEREAL', status: 'complete',
      desc: 'Materials discovery platform with 10 real materials, property data, compare/filter/search.',
      progress: 100,
      github: 'github.com/Gitcoder12/MATEREAL',
      live: 'gitcoder12.github.io/MATEREAL',
      tech: ['HTML','CSS','JS'],
      features: [
        {name:'10 materials database', status:'done'},
        {name:'Property comparison', status:'done'},
        {name:'Filter & search', status:'done'},
        {name:'Scientific UI', status:'done'},
      ],
      updated: Date.now() - 259200000
    },
    {
      id: uid(), name: 'BrightScope', status: 'active',
      desc: 'Research paper search platform. Flask + React + arXiv API integration.',
      progress: 60,
      github: 'github.com/Gitcoder12/BrightScope',
      live: '',
      tech: ['React','Flask','Python','arXiv API'],
      features: [
        {name:'arXiv search', status:'done'},
        {name:'Paper cards UI', status:'done'},
        {name:'Flask backend', status:'done'},
        {name:'Filters by category', status:'wip'},
        {name:'Save papers', status:'todo'},
      ],
      updated: Date.now() - 345600000
    },
    {
      id: uid(), name: 'ProjectXP', status: 'active',
      desc: 'Smart developer project progress tracker with completion stats, feature status, and visual progress insights.',
      progress: 80,
      github: 'github.com/Gitcoder12/ProjectXP',
      live: 'gitcoder12.github.io/ProjectXP',
      tech: ['HTML','CSS','JS'],
      features: [
        {name:'Project cards grid', status:'done'},
        {name:'Stats dashboard', status:'done'},
        {name:'Add/edit/delete projects', status:'done'},
        {name:'Feature status tracker', status:'done'},
        {name:'Filter & search', status:'done'},
        {name:'localStorage persistence', status:'done'},
        {name:'Export JSON', status:'done'},
        {name:'GitHub API sync', status:'todo'},
      ],
      updated: Date.now()
    },
  ];
  save();
}

// ── STATS ──
function updateStats() {
  const total = projects.length;
  const avg = total ? Math.round(projects.reduce((s,p)=>s+(p.progress||0),0)/total) : 0;
  const complete = projects.filter(p=>p.status==='complete').length;
  const active = projects.filter(p=>p.status==='active'||p.status==='building').length;
  const allFeats = projects.flatMap(p=>p.features||[]);
  const doneFeats = allFeats.filter(f=>f.status==='done').length;

  document.getElementById('s-total').textContent = total;
  document.getElementById('s-avg').innerHTML = avg + '<span>%</span>';
  document.getElementById('s-complete').textContent = complete;
  document.getElementById('s-active').textContent = active;
  document.getElementById('s-feats').innerHTML = doneFeats + '<span style="color:var(--text3);font-size:0.9rem">/'+allFeats.length+'</span>';
  document.getElementById('s-feats-sub').textContent = allFeats.length ? 'features implemented' : 'no features yet';
  document.getElementById('project-count-label').textContent = total + ' project' + (total!==1?'s':'');
}

// ── RENDER ──
function render() {
  updateStats();
  const q = document.getElementById('search-input').value.toLowerCase();
  const sort = document.getElementById('sort-select').value;

  let filtered = projects.filter(p => {
    const matchF = currentFilter==='all' || p.status===currentFilter;
    const matchQ = !q || (p.name||'').toLowerCase().includes(q) || (p.desc||'').toLowerCase().includes(q) || (p.tech||[]).some(t=>(t||'').toLowerCase().includes(q));
    return matchF && matchQ;
  });

  filtered.sort((a,b) => {
    if(sort==='updated')    return (b.updated||0) - (a.updated||0);
    if(sort==='progress-d') return (b.progress||0) - (a.progress||0);
    if(sort==='progress-a') return (a.progress||0) - (b.progress||0);
    if(sort==='name')       return (a.name||'').localeCompare(b.name||'');
    if(sort==='features')   return (b.features||[]).length - (a.features||[]).length;
    return 0;
  });

  const container = document.getElementById('projects-container');
  if(!filtered.length) {
    container.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><span class="big">◯</span><p>No projects found</p><button class="btn btn-primary" onclick="openAddModal()">+ New Project</button></div>`;
    return;
  }

  container.innerHTML = filtered.map(buildCard).join('');

  requestAnimationFrame(() => {
    document.querySelectorAll('.project-card').forEach(card => {
      const pct = card.dataset.progress;
      card.style.setProperty('--progress-fill', pct/100);
      const bar = card.querySelector('.progress-bar');
      if(bar) { bar.style.width = '0'; requestAnimationFrame(()=>{ bar.style.width=pct+'%'; }); }
    });
  });
}

function buildCard(p) {
  const feats = p.features || [];
  const statusMap = {
    active:   ['s-active','Active'],
    building: ['s-building','Building'],
    paused:   ['s-paused','Paused'],
    complete: ['s-complete','Complete'],
    broken:   ['s-broken','Broken'],
  };
  const [sc, sl] = statusMap[p.status] || ['s-paused','Unknown'];

  return `<div class="project-card" data-id="${esc(p.id)}" data-progress="${Number(p.progress)||0}" onclick="openDetail('${esc(p.id)}')">
    <div class="card-header">
      <div class="card-title">${esc(p.name)}</div>
      <div style="display:flex;gap:0.4rem;align-items:center">
        <span class="status-badge ${sc}">${sl}</span>
        <div class="card-actions" onclick="event.stopPropagation()">
          <button class="btn btn-sm" onclick="openEdit('${esc(p.id)}')">Edit</button>
          <button class="btn btn-sm" onclick="deleteProject('${esc(p.id)}')">Delete</button>
        </div>
      </div>
    </div>
    <div class="card-desc">${esc(p.desc)||'No description.'}</div>
    <div class="progress-section">
      <div class="progress-header">
        <span class="progress-label">Completion</span>
        <span class="progress-pct">${Number(p.progress)||0}%</span>
      </div>
      <div class="progress-track">
        <div class="progress-bar" style="width:0%"></div>
      </div>
    </div>
    ${feats.length ? `
    <div class="features-wrap">
      ${feats.slice(0,6).map(f=>`<span class="feature-tag ${esc(f.status)}">${esc(f.name)}</span>`).join('')}
      ${feats.length>6?`<span class="feature-tag todo">+${feats.length-6}</span>`:''}
    </div>` : ''}
    <div class="card-bottom">
      <div class="card-tech">
        ${(p.tech||[]).map(t=>`<span class="tech-pill">${esc(t)}</span>`).join('')}
      </div>
      <div class="card-meta">
        <div class="card-date">${timeAgo(p.updated||Date.now())}</div>
        ${feats.length?`<div class="card-feat-count">${feats.filter(f=>f.status==='done').length}/${feats.length} features</div>`:''}
      </div>
    </div>
  </div>`;
}

// ── DETAIL ──
function openDetail(id) {
  const p = projects.find(x=>x.id===id);
  if(!p) return;
  const feats = p.features || [];
  const done = feats.filter(f=>f.status==='done').length;
  const wip  = feats.filter(f=>f.status==='wip').length;
  const todo = feats.filter(f=>f.status==='todo').length;
  const ghUrl = p.github ? safeUrl(p.github) : '';
  const liveUrl = p.live ? safeUrl(p.live) : '';

  document.getElementById('detail-content').innerHTML = `
    <div class="modal-header">
      <div>
        <div style="font-family:var(--display);font-size:1.75rem;font-weight:400;letter-spacing:0.03em;text-transform:uppercase;line-height:1">${esc(p.name)}</div>
        <div style="font-family:var(--mono);font-size:0.72rem;color:var(--text3);margin-top:0.4rem">${esc((p.tech||[]).join(' · '))}</div>
      </div>
      <div style="display:flex;gap:0.5rem;align-items:center">
        <button class="btn btn-sm" onclick="closeDetail();openEdit('${esc(p.id)}')">Edit</button>
        <button class="modal-close" onclick="closeDetail()">✕</button>
      </div>
    </div>
    <div class="modal-body">
      <div class="detail-section">
        <div style="font-size:0.92rem;color:var(--text2);line-height:1.7;margin-bottom:1.25rem">${esc(p.desc)||''}</div>
        <div style="display:flex;gap:0.6rem;flex-wrap:wrap">
          ${ghUrl?`<a href="${esc(ghUrl)}" target="_blank" rel="noopener noreferrer" class="btn btn-sm">GitHub ↗</a>`:''}
          ${liveUrl?`<a href="${esc(liveUrl)}" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-primary">Live Site ↗</a>`:''}
        </div>
      </div>

      <div class="detail-section">
        <div class="detail-section-title">Progress</div>
        <div style="display:flex;align-items:center;gap:2rem">
          <div style="font-family:var(--display);font-size:3rem;font-weight:400;color:var(--text);letter-spacing:0.02em;line-height:1">${Number(p.progress)||0}%</div>
          <div style="flex:1">
            <div class="progress-track" style="height:5px">
              <div class="progress-bar" style="width:${Number(p.progress)||0}%"></div>
            </div>
            <div style="font-family:var(--mono);font-size:0.72rem;color:var(--text3);margin-top:0.65rem">
              ${done} done · ${wip} in progress · ${todo} todo
            </div>
          </div>
        </div>
      </div>

      ${feats.length?`
      <div class="detail-section">
        <div class="detail-section-title">Features (${feats.length})</div>
        <div class="detail-features-grid">
          ${feats.map(f=>`
            <div class="detail-feat">
              <div class="feat-dot ${esc(f.status)}"></div>
              <span style="color:${f.status==='done'?'var(--text)':f.status==='wip'?'var(--text2)':'var(--text3)'}">${esc(f.name)}</span>
            </div>`).join('')}
        </div>
      </div>`:''}

      <div style="display:flex;justify-content:flex-end;margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid var(--border)">
        <button class="btn btn-sm" onclick="closeDetail();deleteProject('${esc(p.id)}')">Delete Project</button>
      </div>
    </div>`;
  document.getElementById('detail-modal').classList.add('open');
}
function closeDetail() { document.getElementById('detail-modal').classList.remove('open'); }

// ── ADD / EDIT ──
function openAddModal() {
  editingId = null;
  tempTech = [];
  document.getElementById('modal-title-text').textContent = 'New Project';
  document.getElementById('save-btn').textContent = 'Save Project';
  clearForm();
  document.getElementById('add-modal').classList.add('open');
  setTimeout(() => document.getElementById('f-name').focus(), 50);
}
function openEdit(id) {
  const p = projects.find(x=>x.id===id);
  if(!p) return;
  editingId = id;
  tempTech = [...(p.tech||[])];
  document.getElementById('modal-title-text').textContent = 'Edit Project';
  document.getElementById('save-btn').textContent = 'Update Project';
  document.getElementById('f-name').value = p.name||'';
  document.getElementById('f-status').value = p.status||'building';
  document.getElementById('f-desc').value = p.desc||'';
  document.getElementById('f-progress').value = p.progress||0;
  document.getElementById('f-github').value = p.github||'';
  document.getElementById('f-live').value = p.live||'';
  renderFeatureEditor(p.features||[]);
  renderTechTags();
  document.getElementById('add-modal').classList.add('open');
}
function closeModal() {
  document.getElementById('add-modal').classList.remove('open');
  editingId = null;
}
function clearForm() {
  ['f-name','f-desc','f-github','f-live'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-status').value='building';
  document.getElementById('f-progress').value=0;
  document.getElementById('features-editor').innerHTML='';
  renderTechTags();
}

function saveProject() {
  const name = document.getElementById('f-name').value.trim();
  if(!name) { toast('Project name required'); return; }

  const feats = [];
  document.querySelectorAll('.feature-row').forEach(row => {
    const inp = row.querySelector('input');
    const sel = row.querySelector('select');
    if(inp?.value.trim()) {
      const status = ['done','wip','todo'].includes(sel?.value) ? sel.value : 'todo';
      feats.push({ name: inp.value.trim(), status });
    }
  });

  const data = {
    name,
    status:   document.getElementById('f-status').value,
    desc:     document.getElementById('f-desc').value.trim(),
    progress: Math.min(100,Math.max(0,parseInt(document.getElementById('f-progress').value)||0)),
    github:   document.getElementById('f-github').value.trim(),
    live:     document.getElementById('f-live').value.trim(),
    tech:     [...tempTech],
    features: feats,
    updated:  Date.now(),
  };

  if(editingId) {
    const i = projects.findIndex(p=>p.id===editingId);
    if(i>=0) projects[i] = { ...projects[i], ...data };
    toast('Project updated');
  } else {
    projects.unshift({ id: uid(), ...data });
    toast('Project added');
  }
  save(); closeModal(); render();
}

function deleteProject(id) {
  if(!confirm('Delete this project?')) return;
  projects = projects.filter(p=>p.id!==id);
  save(); render(); toast('Project deleted');
}

// Feature editor
function renderFeatureEditor(feats=[]) {
  const ed = document.getElementById('features-editor');
  ed.innerHTML = '';
  feats.forEach(f => ed.appendChild(buildFeatureRow(f.name, f.status)));
}
function buildFeatureRow(name = '', status = 'todo') {
  const row = document.createElement('div');
  row.className = 'feature-row';

  const inp = document.createElement('input');
  inp.placeholder = 'Feature name';
  inp.value = name;

  const sel = document.createElement('select');
  ['todo','wip','done'].forEach(v => {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v === 'todo' ? 'Todo' : v === 'wip' ? 'WIP' : 'Done';
    if (v === status) opt.selected = true;
    sel.appendChild(opt);
  });

  const rm = document.createElement('button');
  rm.className = 'rm-btn';
  rm.type = 'button';
  rm.textContent = '✕';
  rm.onclick = () => row.remove();

  row.append(inp, sel, rm);
  return row;
}
function addFeatureRow() {
  const ed = document.getElementById('features-editor');
  const row = buildFeatureRow('', 'todo');
  ed.appendChild(row);
  row.querySelector('input').focus();
}

// Tech tags
function addTech() {
  const inp = document.getElementById('tech-input');
  const val = inp.value.trim();
  if(val && !tempTech.includes(val)) { tempTech.push(val); renderTechTags(); }
  inp.value = '';
  inp.focus();
}
function removeTech(idx) {
  tempTech.splice(idx, 1);
  renderTechTags();
}
function renderTechTags() {
  const c = document.getElementById('tech-tags');
  c.innerHTML = '';
  tempTech.forEach((t, i) => {
    const span = document.createElement('span');
    span.className = 'tech-tag-edit';
    span.textContent = t;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = '✕';
    btn.onclick = () => removeTech(i);
    span.appendChild(btn);
    c.appendChild(span);
  });
}

// ── FILTERS ──
document.querySelectorAll('.ftab').forEach(btn => {
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.ftab').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    currentFilter = btn.dataset.filter;
    render();
  });
});
document.getElementById('search-input').addEventListener('input', render);
document.getElementById('sort-select').addEventListener('change', render);

// ── EXPORT / IMPORT ──
function exportData() {
  const blob = new Blob([JSON.stringify(projects, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'projectxp-export.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Exported projectxp-export.json');
}
function importData() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json';
  inp.onchange = e => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data)) throw new Error('not an array');
        if (!confirm(`Replace ${projects.length} projects with ${data.length} from file?`)) return;
        projects = data;
        save(); render();
        toast(`Imported ${data.length} projects`);
      } catch {
        toast('Invalid JSON file');
      }
    };
    reader.readAsText(file);
  };
  inp.click();
}

// ── KEYBOARD ──
document.addEventListener('keydown', e => {
  if(e.key==='Escape') { closeModal(); closeDetail(); }
  if(e.key==='n' && !e.target.matches('input,textarea,select')) {
    if (!document.getElementById('add-modal').classList.contains('open') &&
        !document.getElementById('detail-modal').classList.contains('open')) {
      e.preventDefault();
      openAddModal();
    }
  }
});

// ── INIT ──
load();
render();
</script>
</body>
